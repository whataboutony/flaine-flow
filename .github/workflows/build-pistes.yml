name: Build Flaine piste dataset
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 1 * *'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract OSM pistes and lifts
        run: python scripts/build_pistes.py
      - name: Commit verified GeoJSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pistes.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Update OSM Flaine piste dataset"
            git push
          fi
