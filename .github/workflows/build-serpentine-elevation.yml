name: Build Serpentine COP30 elevation
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build_serpentine_elevation.py
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rasterio
      - run: python scripts/build_serpentine_elevation.py
      - name: Commit derived elevation profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/serpentine-elevation-cop30.json
          git diff --cached --quiet || git commit -m "Build Serpentine COP30 elevation profile"
          git push
