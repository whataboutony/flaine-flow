<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flaine Flow — Terrain Model</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#d9e3e9;font-family:system-ui}canvas{display:block}.hud{position:fixed;z-index:2;top:14px;left:14px;background:#fffc;padding:10px 13px;border-radius:12px;box-shadow:0 4px 20px #0002}.hud b{display:block}.hud small{color:#53616b}</style></head><body><div class="hud"><b>Flaine · raised relief</b><small>Real COP30 terrain · drag to orbit · wheel to zoom</small></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'https://unpkg.com/three@0.169.0/examples/jsm/controls/OrbitControls.js';
const d=await fetch('./data/flaine-terrain-cop30.json').then(r=>{if(!r.ok)throw Error('Terrain grid not built yet');return r.json()});
const renderer=new THREE.WebGLRenderer({antialias:true});document.body.appendChild(renderer.domElement);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xd9e3e9);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,200);camera.position.set(11,8,13);
const ctl=new OrbitControls(camera,renderer.domElement);ctl.enableDamping=true;ctl.target.set(0,1.5,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x687365,2.0));const sun=new THREE.DirectionalLight(0xfff7e8,3.6);sun.position.set(-8,14,8);sun.castShadow=true;scene.add(sun);
const rows=d.rows,cols=d.cols,W=13,H=8.2,z0=d.min_elevation_m,vertical=0.0042,pos=[],colors=[],ix=[];
for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const e=d.elevations_m[r][c],x=(c/(cols-1)-.5)*W,z=(r/(rows-1)-.5)*H,y=(e-z0)*vertical;pos.push(x,y,z);const t=(e-d.min_elevation_m)/(d.max_elevation_m-d.min_elevation_m);colors.push(.66+.30*t,.72+.25*t,.69+.28*t)}
for(let r=0;r<rows-1;r++)for(let c=0;c<cols-1;c++){let a=r*cols+c,b=a+1,cc=a+cols,dd=cc+1;ix.push(a,cc,b,b,cc,dd)}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));g.setIndex(ix);g.computeVertexNormals();
const terrain=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.96}));terrain.castShadow=terrain.receiveShadow=true;scene.add(terrain);
const base=new THREE.Mesh(new THREE.BoxGeometry(W,.35,H),new THREE.MeshStandardMaterial({color:0xaab3a7,roughness:1}));base.position.y=-.19;scene.add(base);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
(function loop(){ctl.update();renderer.render(scene,camera);requestAnimationFrame(loop)})();
</script></body></html>
